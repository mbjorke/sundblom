name: 🗞️ Sundbloms dagliga kommentar

on:
  schedule:
    # 16:30 finsk vintertid EET (UTC+2): nov–mar → 14:30 UTC
    - cron: "30 14 * 1,2,3,10,11,12 *"
    # 16:30 finsk sommartid EEST (UTC+3): apr–sep → 13:30 UTC
    - cron: "30 13 * 4,5,6,7,8,9 *"

  # Tillåt manuell körning från Actions-fliken
  workflow_dispatch:

permissions:
  contents: write   # Krävs för att pusha till repot

jobs:
  generate-and-publish:
    name: Generera Sundblomsk kommentar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # 1. Checka ut repot
      - name: Checka ut kod
        uses: actions/checkout@v4

      # 2. Sätt upp Python
      - name: Sätt upp Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Installera Python-beroenden
      - name: Installera Python-beroenden
        run: pip install -r requirements.txt

      # 4. Kör generatorn (skriver JSON till src/content/articles/)
      - name: Kör Sundbloms generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:       ${{ github.repository }}
          GITHUB_BRANCH:     ${{ github.ref_name }}
        run: python main.py
