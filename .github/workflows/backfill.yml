name: 🗂️ Backfill mars 2026

on:
  workflow_dispatch:  # Körs manuellt en gång

permissions:
  contents: write

jobs:
  backfill:
    name: Backfilla saknade mars-artiklar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Kör backfill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUNDBLOM_MODEL:    ${{ secrets.SUNDBLOM_MODEL }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:       ${{ github.repository }}
          GITHUB_BRANCH:     main
        run: python backfill_march.py
