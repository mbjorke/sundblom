name: 🗞️ Sundbloms nattliga kommentar

on:
  schedule:
    # Kl. 16:00 UTC varje dag (= 18:00 finsk vintertid / 19:00 sommartid)
    - cron: "0 16 * * *"

  # Tillåt manuell körning från Actions-fliken
  workflow_dispatch:

permissions:
  contents: write   # Krävs för att pusha till repot

jobs:
  generate-and-publish:
    name: Generera Sundblomsk kommentar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # 1. Checka ut repot
      - name: Checka ut kod
        uses: actions/checkout@v4

      # 2. Sätt upp Python
      - name: Sätt upp Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Installera beroenden
      - name: Installera beroenden
        run: pip install -r requirements.txt

      # 3b. Installera Playwright + Chromium (för OG-skärmdump)
      - name: Installera Playwright Chromium
        run: playwright install chromium --with-deps

      # 4. Kör generatorn
      - name: Kör Sundbloms generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:       ${{ github.repository }}
          GITHUB_BRANCH:     ${{ github.ref_name }}
        run: python main.py

      # 5. Spara index.html som artefakt (för felsökning)
      - name: Spara HTML-artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sundblom-${{ github.run_id }}
          path: index.html
          retention-days: 30
